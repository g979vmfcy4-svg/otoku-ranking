name: Patch Bayesian Ranking

on:
  push:
    branches:
      - agent/bayesian-ranking

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest

    env:
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/bayesian-ranking

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply minimal Bayesian ranking patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("generate.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{label}: 置換対象が1件ではありません。件数={count}"
                  )
              text = text.replace(old, new, 1)

          replace_once(
              "import math\n",
              "",
              "math import削除",
          )

          replace_once(
              "RANKING_SIZE = 10\n\n\nGOOGLE_SITE_VERIFICATION",
              "RANKING_SIZE = 10\nBAYES_PRIOR_WEIGHT = 100\n\n\nGOOGLE_SITE_VERIFICATION",
              "ベイズ事前レビュー数追加",
          )

          score_start_marker = (
              "# =========================================================\n"
              "# ランキングスコア\n"
          )
          filter_marker = (
              "# =========================================================\n"
              "# 商品絞り込み\n"
          )

          score_start = text.find(score_start_marker)
          filter_start = text.find(filter_marker, score_start)

          if score_start < 0 or filter_start < 0:
              raise RuntimeError("既存ランキングスコア部分を特定できません。")

          new_score_block = '''# =========================================================
          # ベイズ補正ランキングスコア
          # =========================================================

          def score(
              item,
              prior_rating,
          ):

              rating = to_float(
                  item.get(
                      "reviewAverage"
                  )
              )


              reviews = to_int(
                  item.get(
                      "reviewCount"
                  )
              )


              return (
                  reviews * rating
                  +
                  BAYES_PRIOR_WEIGHT * prior_rating
              ) / (
                  reviews
                  +
                  BAYES_PRIOR_WEIGHT
              )


          '''

          # heredoc内のPythonコードを読みやすくするために付いた
          # 先頭10スペースを除去する。
          new_score_block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_score_block.splitlines()
          ) + "\n"

          text = (
              text[:score_start]
              + new_score_block
              + text[filter_start:]
          )

          ranking_marker = (
              "# =========================================================\n"
              "# ランキング作成\n"
          )

          ranking_pos = text.find(ranking_marker)
          if ranking_pos < 0:
              raise RuntimeError("ランキング作成部分を特定できません。")

          prior_block = '''# =========================================================
          # ベイズ補正用の基準評価
          #
          # 候補商品の平均レビュー評価を基準にして、
          # レビュー件数が少ない商品の高評価を過大評価しにくくする。
          # =========================================================

          prior_rating = (
              sum(
                  to_float(
                      item.get(
                          "reviewAverage"
                      )
                  )
                  for item in filtered
              )
              / len(filtered)
          )


          '''

          prior_block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in prior_block.splitlines()
          ) + "\n"

          text = (
              text[:ranking_pos]
              + prior_block
              + text[ranking_pos:]
          )

          replace_once(
              "    key=score,\n",
              "    key=lambda item: score(\n        item,\n        prior_rating,\n    ),\n",
              "ランキングsort変更",
          )

          replace_once(
              "        評価の高さだけでなく\n"
              "        レビュー件数も加味して\n"
              "        順位を決定しています。",
              "        候補商品の平均評価を基準にベイズ補正を行い、\n"
              "        評価の高さとレビュー件数の信頼度を\n"
              "        両方反映して順位を決定しています。",
              "ランキング説明変更",
          )

          log_anchor = '''print(
              f"掲載件数: "
              f"{len(ranking_items)}"
          )
          '''
          log_anchor = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in log_anchor.splitlines()
          )

          bayes_log = '''print(
              f"ベイズ事前平均: "
              f"{prior_rating:.4f}"
          )


          print(
              f"ベイズ事前レビュー数: "
              f"{BAYES_PRIOR_WEIGHT}"
          )


          print(
              "Bayesian ranking: OK"
          )
          '''
          bayes_log = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in bayes_log.splitlines()
          )

          replace_once(
              log_anchor,
              log_anchor + "\n\n\n" + bayes_log,
              "ベイズログ追加",
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Syntax check
        run: python -m py_compile generate.py

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run real ranking generation test
        run: python generate.py

      - name: Restore generated page and remove temporary workflow
        run: |
          git restore public/index.html
          rm .github/workflows/patch-bayesian.yml

      - name: Commit tested minimal patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generate.py .github/workflows/patch-bayesian.yml
          git diff --cached --quiet && exit 1
          git commit -m "Use Bayesian ranking score"
          git push origin agent/bayesian-ranking
