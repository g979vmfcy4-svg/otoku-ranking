name: Update Rakuten Ranking

on:
  workflow_dispatch:

  schedule:
    - cron: "0 21 * * *"

  push:
    branches:
      - main
    paths:
      - "generate.py"
      - ".github/workflows/update.yml"
      - "scripts/inject_methodology_nav.py"
      - "scripts/enhance_page_quality.py"
      - "scripts/generate_price_bands.py"
      - "scripts/generate_category_pages.py"
      - "scripts/update_price_band_copy.py"
      - "scripts/enhance_seo_structure.py"
      - "scripts/finalize_category_names.py"
      - "scripts/add_ranking_statistics.py"
      - "scripts/add_card_insights.py"
      - "scripts/add_sales_comparison.py"
      - "scripts/enhance_search_metadata.py"
      - "scripts/submit_indexnow.py"
      - "scripts/inject_analytics.py"
      - "public/assets/site-v2.css"
      - "public/assets/seo-expansion.css"
      - "public/assets/seo-hardening.css"
      - "public/assets/data-insights.css"
      - "public/assets/sales-comparison.css"
      - "public/assets/analytics.js"
      - "public/earphones/index.html"
      - "public/404.html"
      - "public/_headers"
      - "public/favicon.svg"
      - "public/fb6c0bc82a2306cdb2d15bc398deffe4.txt"

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    env:
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check Python syntax
        id: syntax
        run: python -m py_compile generate.py scripts/inject_methodology_nav.py scripts/enhance_page_quality.py scripts/generate_price_bands.py scripts/generate_category_pages.py scripts/update_price_band_copy.py scripts/enhance_seo_structure.py scripts/finalize_category_names.py scripts/add_ranking_statistics.py scripts/add_card_insights.py scripts/add_sales_comparison.py scripts/enhance_search_metadata.py scripts/submit_indexnow.py scripts/inject_analytics.py

      - name: Install Playwright
        id: playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Generate ranking pages
        id: base_ranking
        run: python generate.py

      - name: Generate non-overlapping price bands
        id: price_bands
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/price-band-generation.log
          for attempt in 1 2 3; do
            echo "Price-band generation attempt ${attempt}/3" | tee -a /tmp/price-band-generation.log
            if python scripts/generate_price_bands.py 2>&1 | tee -a /tmp/price-band-generation.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Generate category ranking pages
        id: categories
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/category-generation.log
          for attempt in 1 2 3; do
            echo "Category generation attempt ${attempt}/3" | tee -a /tmp/category-generation.log
            if python scripts/generate_category_pages.py 2>&1 | tee -a /tmp/category-generation.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Add site navigation and SEO
        id: navigation
        run: python scripts/inject_methodology_nav.py

      - name: Enhance page quality
        id: quality
        run: python scripts/enhance_page_quality.py

      - name: Update price band copy
        id: price_copy
        run: python scripts/update_price_band_copy.py

      - name: Add SEO structure and sitemap
        id: seo_structure
        run: python scripts/enhance_seo_structure.py

      - name: Finalize category product names
        id: final_names
        run: python scripts/finalize_category_names.py

      - name: Add product ranking reasons
        id: rank_reasons
        run: python scripts/add_card_insights.py

      - name: Add ranking statistics
        id: ranking_stats
        shell: bash
        run: |
          set -o pipefail
          python scripts/add_ranking_statistics.py 2>&1 | tee /tmp/ranking-stats.log

      - name: Compare Rakuten sales and high-rating ranks
        id: sales_compare
        continue-on-error: true
        run: python scripts/add_sales_comparison.py

      - name: Improve search metadata and image loading
        id: search_metadata
        run: python scripts/enhance_search_metadata.py

      - name: Add analytics tracking
        id: analytics
        run: python scripts/inject_analytics.py

      - name: Commit updated pages
        id: commit_pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/last-workflow-failure.txt
          git add public/index.html public/earphones/index.html public/earphones/under-5000/index.html public/earphones/under-10000/index.html public/earphones/wireless/index.html public/earphones/wired/index.html public/earphones/earcuff/index.html public/earphones/most-reviewed/index.html public/earphones/methodology/index.html public/about/index.html public/sitemap.xml
          git add -u .github/last-workflow-failure.txt || true
          git diff --cached --quiet && exit 0
          git commit -m "Update ranking"
          git push

      - name: Wait briefly for Pages deployment
        id: pages_ready
        continue-on-error: true
        shell: bash
        run: |
          KEY_URL="https://otoku-ranking.pages.dev/fb6c0bc82a2306cdb2d15bc398deffe4.txt"
          EXPECTED="fb6c0bc82a2306cdb2d15bc398deffe4"
          for attempt in 1 2 3 4 5 6; do
            value="$(curl -fsS "$KEY_URL" || true)"
            if [ "$value" = "$EXPECTED" ]; then
              sleep 20
              exit 0
            fi
            sleep 10
          done
          echo "IndexNow verification key is not public yet"
          exit 1

      - name: Notify IndexNow search engines
        id: indexnow
        if: steps.pages_ready.outcome == 'success'
        continue-on-error: true
        run: python scripts/submit_indexnow.py

      - name: Record failed stage privately
        if: failure()
        run: |
          {
            echo "workflow_failure=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "syntax=${{ steps.syntax.outcome }}"
            echo "playwright=${{ steps.playwright.outcome }}"
            echo "base_ranking=${{ steps.base_ranking.outcome }}"
            echo "price_bands=${{ steps.price_bands.outcome }}"
            echo "categories=${{ steps.categories.outcome }}"
            echo "navigation=${{ steps.navigation.outcome }}"
            echo "quality=${{ steps.quality.outcome }}"
            echo "price_copy=${{ steps.price_copy.outcome }}"
            echo "seo_structure=${{ steps.seo_structure.outcome }}"
            echo "final_names=${{ steps.final_names.outcome }}"
            echo "rank_reasons=${{ steps.rank_reasons.outcome }}"
            echo "ranking_stats=${{ steps.ranking_stats.outcome }}"
            echo "sales_compare=${{ steps.sales_compare.outcome }}"
            echo "search_metadata=${{ steps.search_metadata.outcome }}"
            echo "analytics=${{ steps.analytics.outcome }}"
            echo "commit_pages=${{ steps.commit_pages.outcome }}"
            if [ -f /tmp/price-band-generation.log ]; then
              echo ""
              echo "--- price band generation tail ---"
              tail -n 80 /tmp/price-band-generation.log
            fi
            if [ -f /tmp/category-generation.log ]; then
              echo ""
              echo "--- category generation tail ---"
              tail -n 80 /tmp/category-generation.log
            fi
            if [ -f /tmp/ranking-stats.log ]; then
              echo ""
              echo "--- ranking statistics tail ---"
              tail -n 80 /tmp/ranking-stats.log
            fi
          } > .github/last-workflow-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-workflow-failure.txt
          git commit -m "Record ranking workflow failure" || exit 0
          git push || true
