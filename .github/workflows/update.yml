name: Apply Methodology Migration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  apply-methodology:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply methodology page and navigation
        run: python scripts/add_methodology.py

      - name: Check Python syntax
        run: python -m py_compile generate.py

      - name: Commit methodology migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add methodology page"
          git push
