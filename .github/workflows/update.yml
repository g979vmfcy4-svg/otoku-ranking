name: Update Rakuten Ranking

on:
  workflow_dispatch:

  schedule:
    - cron: "0 21 * * *"

  push:
    branches:
      - main
    paths:
      - "generate.py"
      - ".github/workflows/update.yml"
      - "scripts/inject_methodology_nav.py"
      - "scripts/enhance_page_quality.py"
      - "scripts/generate_price_bands.py"
      - "scripts/generate_category_pages.py"
      - "scripts/update_price_band_copy.py"
      - "scripts/enhance_seo_structure.py"
      - "scripts/inject_analytics.py"
      - "public/assets/site-v2.css"
      - "public/assets/seo-expansion.css"
      - "public/assets/analytics.js"
      - "public/earphones/index.html"

permissions:
  contents: write

jobs:
  update-ranking:
    runs-on: ubuntu-latest

    env:
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check Python syntax
        id: syntax
        run: python -m py_compile generate.py scripts/inject_methodology_nav.py scripts/enhance_page_quality.py scripts/generate_price_bands.py scripts/generate_category_pages.py scripts/update_price_band_copy.py scripts/enhance_seo_structure.py scripts/inject_analytics.py

      - name: Install Playwright
        id: playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Generate ranking pages
        id: base_ranking
        run: python generate.py

      - name: Generate non-overlapping price bands
        id: price_bands
        run: python scripts/generate_price_bands.py

      - name: Generate category ranking pages
        id: categories
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_category_pages.py 2>&1 | tee /tmp/category-generation.log

      - name: Add site navigation and SEO
        id: navigation
        run: python scripts/inject_methodology_nav.py

      - name: Enhance page quality
        id: quality
        run: python scripts/enhance_page_quality.py

      - name: Update price band copy
        id: price_copy
        run: python scripts/update_price_band_copy.py

      - name: Add SEO structure and sitemap
        id: seo_structure
        run: python scripts/enhance_seo_structure.py

      - name: Add analytics tracking
        id: analytics
        run: python scripts/inject_analytics.py

      - name: Commit updated pages
        id: commit_pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/earphones/index.html public/earphones/under-5000/index.html public/earphones/under-10000/index.html public/earphones/wireless/index.html public/earphones/wired/index.html public/earphones/earcuff/index.html public/earphones/most-reviewed/index.html public/earphones/methodology/index.html public/about/index.html public/sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "Update ranking"
          git push

      - name: Record failed stage
        if: failure()
        shell: bash
        run: |
          {
            echo "workflow_failure=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "syntax=${{ steps.syntax.outcome }}"
            echo "playwright=${{ steps.playwright.outcome }}"
            echo "base_ranking=${{ steps.base_ranking.outcome }}"
            echo "price_bands=${{ steps.price_bands.outcome }}"
            echo "categories=${{ steps.categories.outcome }}"
            echo "navigation=${{ steps.navigation.outcome }}"
            echo "quality=${{ steps.quality.outcome }}"
            echo "price_copy=${{ steps.price_copy.outcome }}"
            echo "seo_structure=${{ steps.seo_structure.outcome }}"
            echo "analytics=${{ steps.analytics.outcome }}"
            echo "commit_pages=${{ steps.commit_pages.outcome }}"
            if [ -f /tmp/category-generation.log ]; then
              echo ""
              echo "--- category-generation.log ---"
              tail -n 80 /tmp/category-generation.log
            fi
          } > public/build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/build-status.txt
          git commit -m "Record ranking workflow failure" || exit 0
          git push || true
