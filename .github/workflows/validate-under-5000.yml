name: Validate Under 5000 Ranking

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Syntax check
        run: python -m py_compile generate.py

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run real ranking generation
        run: python generate.py

      - name: Validate pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("public/index.html")
          under = Path("public/earphones/under-5000/index.html")

          if not root.exists() or not under.exists():
              raise RuntimeError("必要なページが生成されていません。")

          root_text = root.read_text(encoding="utf-8")
          under_text = under.read_text(encoding="utf-8")

          if root_text.count('class="card"') != 10:
              raise RuntimeError("総合ランキングが10件ではありません。")

          if under_text.count('class="card"') != 10:
              raise RuntimeError("5,000円以下ランキングが10件ではありません。")

          prices = [
              int(value.replace(",", ""))
              for value in re.findall(
                  r'class="price">\s*([0-9,]+)円',
                  under_text,
              )
          ]

          if len(prices) != 10:
              raise RuntimeError(f"価格検出件数が異常です: {len(prices)}")

          if any(price > 5000 for price in prices):
              raise RuntimeError(f"5,000円超の商品があります: {prices}")

          if "5,000円以下 イヤホン高評価ランキング" not in under_text:
              raise RuntimeError("5,000円以下ページのH1が不正です。")

          if "https://otoku-ranking.pages.dev/earphones/under-5000/" not in under_text:
              raise RuntimeError("5,000円以下ページのcanonicalが不正です。")

          if 'href="/earphones/under-5000/"' not in root_text:
              raise RuntimeError("総合ページからの内部リンクがありません。")

          print("Validation OK")
          print("Under 5000 prices:", prices)
          PY
