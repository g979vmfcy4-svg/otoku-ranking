name: Run Most Reviewed Branch Test

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-most-reviewed-branch.yml"

permissions:
  contents: write

jobs:
  patch-test-branch:
    runs-on: ubuntu-latest

    env:
      RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}

    steps:
      - name: Checkout work branch
        uses: actions/checkout@v5
        with:
          ref: agent/most-reviewed-ranking
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply ranking patch
        run: python scripts/add_most_reviewed.py

      - name: Check Python syntax
        run: python -m py_compile generate.py

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Generate all ranking pages
        run: python generate.py

      - name: Validate generated pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = [
              Path("public/index.html"),
              Path("public/earphones/under-5000/index.html"),
              Path("public/earphones/under-10000/index.html"),
              Path("public/earphones/most-reviewed/index.html"),
          ]

          for page in pages:
              if not page.exists():
                  raise RuntimeError(f"missing page: {page}")
              text = page.read_text(encoding="utf-8")
              if text.count('class="card"') != 10:
                  raise RuntimeError(f"card count error: {page}")
              if "/earphones/most-reviewed/" not in text:
                  raise RuntimeError(f"navigation missing: {page}")

          most = pages[-1].read_text(encoding="utf-8")
          if (
              '<link rel="canonical" href="https://otoku-ranking.pages.dev/earphones/most-reviewed/">'
              not in most
          ):
              raise RuntimeError("most-reviewed canonical missing")
          if "レビュー件数が多い イヤホンランキング" not in most:
              raise RuntimeError("most-reviewed H1 missing")

          counts = [
              int(value.replace(",", ""))
              for value in re.findall(r"<span>\(([\d,]+)件\)</span>", most)
          ]
          if len(counts) != 10:
              raise RuntimeError(f"review count extraction error: {counts}")
          if counts != sorted(counts, reverse=True):
              raise RuntimeError(f"review count order error: {counts}")

          print("Most reviewed page validation: OK")
          print("Review counts:", counts)
          PY

      - name: Commit tested work branch
        run: |
          rm scripts/add_most_reviewed.py
          rm .github/workflows/apply-most-reviewed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add most reviewed earphone ranking"
          git push origin HEAD:agent/most-reviewed-ranking

      - name: Remove temporary main workflow
        run: |
          git fetch origin main
          git checkout -B main origin/main
          rm .github/workflows/run-most-reviewed-branch.yml
          git add .github/workflows/run-most-reviewed-branch.yml
          git commit -m "Remove temporary most reviewed workflow"
          git push origin main
