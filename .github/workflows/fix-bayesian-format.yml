name: Fix Bayesian Formatting

on:
  push:
    branches:
      - agent/bayesian-ranking

permissions:
  contents: write

jobs:
  fix-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: agent/bayesian-ranking

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fix formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("generate.py")
          text = path.read_text(encoding="utf-8")

          replacements = {
              '        item.get(\n  "reviewAverage"\n        )':
                  '        item.get(\n            "reviewAverage"\n        )',
              '        item.get(\n  "reviewCount"\n        )':
                  '        item.get(\n            "reviewCount"\n        )',
              '        to_float(\n  item.get(\n      "reviewAverage"\n  )\n        )':
                  '        to_float(\n            item.get(\n                "reviewAverage"\n            )\n        )',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"整形対象が1件ではありません: {old!r} count={count}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Syntax check
        run: python -m py_compile generate.py

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-bayesian-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A generate.py .github/workflows/fix-bayesian-format.yml
          git diff --cached --quiet && exit 1
          git commit -m "Tidy Bayesian ranking formatting"
          git push origin agent/bayesian-ranking
